---
name: Cleanup PR images

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - closed

permissions:
  packages: write

jobs:
  cleanup:
    name: 🧹 Delete pr-${{ github.event.pull_request.number }} images
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete pr-${{ github.event.pull_request.number }} image tags
        # Package/version deletion is not supported by GITHUB_TOKEN, so this
        # needs a classic PAT with read:packages + delete:packages scopes.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DELETE_INTERMEDIATE_PACKAGES_TOKEN }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # ps5-mqtt is the only consumer package CI pushes PR tags to; the HA
          # add-on is only ever pulled by the version pinned in its
          # config.yaml, so CI never pushes a pr-N tag for it.
          packages="ps5-mqtt"

          for pkg in $packages; do
            enc=$(jq -rn --arg p "$pkg" '$p|@uri')
            ids=$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${enc}/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags | index(\"${TAG}\")) | .id" \
              2>/dev/null || true)
            for id in $ids; do
              echo "Deleting ${pkg} version ${id} (tagged ${TAG})"
              gh api -X DELETE \
                "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${enc}/versions/${id}" || true
            done
          done
