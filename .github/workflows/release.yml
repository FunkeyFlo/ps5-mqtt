name: Release

on:
  release:
    types: [published]
  # Manual runs exercise the full pipeline (build, test, package images) but
  # never push, commit, or move a release tag — there's no published release
  # to anchor those side effects to. To actually ship, publish a GitHub
  # release (draft-release.yml keeps one up to date with the next version).
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

# Only one release at a time; a second dispatch waits instead of interleaving.
concurrency:
  group: release
  cancel-in-progress: false

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ps5-mqtt-home-assistant-add-on
  BUILD_IMAGE_NAME: ps5-mqtt-home-assistant-add-on-build

jobs:
  version:
    name: 🧮 Compute version
    runs-on: ubuntu-latest
    outputs:
      # Single source of truth: every other job takes the version from here.
      version: ${{ steps.version.outputs.version }} # e.g. 1.5.0 (images, config.yaml, changelog)
      tag: ${{ steps.version.outputs.tag }} # e.g. v1.5.0 (git tag, GitHub release)
      # true only when this run was triggered by publishing a GitHub release;
      # workflow_dispatch runs build/test everything but never ship it.
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧶 Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: yarn

      - name: ⏬ Install dependencies
        run: yarn install --immutable

      - name: 🧮 Resolve version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: yarn resolve-release-version

  static-analysis:
    name: ✅ Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🧶 Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: yarn

      - name: ⏬ Install dependencies
        run: yarn install --immutable

      - name: 🎨 Check formatting
        run: yarn format/check

      - name: 🔍 Run typecheck
        run: yarn typecheck

      - name: 🧹 Run lint
        run: yarn lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🧶 Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: yarn

      - name: ⏬ Install dependencies
        run: yarn install --immutable

      - name: 🧪 Run tests
        run: yarn run test/unit

  init:
    name: 🧮 Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      registry-prefix: ${{ steps.registry.outputs.prefix }}
    steps:
      - name: 🏷 Compute registry prefix
        id: registry
        # GHCR namespaces must be lowercase; github.repository_owner may not be.
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 🧮 Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.BUILD_IMAGE_NAME }}
          registry-prefix: ${{ steps.registry.outputs.prefix }}

  # Build the app exactly once; every image (both add-on archs and the
  # standalone image) ships the byte-identical artifacts produced here.
  prepare:
    name: 👨‍🏭 Build & package app
    needs:
      - version
      - static-analysis
      - test
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🧶 Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: yarn

      - name: ⏬ Install dependencies
        run: yarn install --immutable

      - name: 🔖 Apply release version
        run: yarn bump-version ${{ needs.version.outputs.version }}

      - name: ⏭ Sync add-on docs
        run: |
          cp README.md add-ons/ps5-mqtt/README.md
          cp docs/DOCS.md add-ons/ps5-mqtt/DOCS.md

      - name: 👨‍🏭 Build App
        run: yarn build

      - name: 📦 Package App
        env:
          PREPARE_ONLY: "1"
          SKIP_BUILD: "1"
        run: yarn workspace @ps5-mqtt/server package

      - name: 🗂 Assemble add-on Docker context
        run: |
          cp add-ons/common/Dockerfile add-ons/ps5-mqtt/
          cp add-ons/common/build.yaml add-ons/ps5-mqtt/
          cp add-ons/common/.dockerignore add-ons/ps5-mqtt/
          cp add-ons/common/run.sh add-ons/ps5-mqtt/
          mkdir -p add-ons/ps5-mqtt/ps5-mqtt/server
          cp -R ps5-mqtt/server/.packaged add-ons/ps5-mqtt/ps5-mqtt/server/.packaged

      - name: ⏫ Upload add-on context
        uses: actions/upload-artifact@v7
        with:
          name: addon-context
          path: add-ons/ps5-mqtt
          include-hidden-files: true
          if-no-files-found: error

      - name: ⏫ Upload packaged app
        uses: actions/upload-artifact@v7
        with:
          name: packaged-app
          path: ps5-mqtt/server/.packaged
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: 🏭 Build & Publish add-on ${{ matrix.arch }}
    needs:
      - version
      - init
      - prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: ⏬ Download prepared add-on context
        uses: actions/download-artifact@v8
        with:
          name: addon-context
          path: add-ons/ps5-mqtt

      - name: 🏭 Build & Publish add-on ps5-mqtt-${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./add-ons/ps5-mqtt
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
          image: ${{ matrix.image }}
          # No "v" prefix: the HA Supervisor pulls <image>:<config.yaml version>.
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest
          version: ${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.should_publish == 'true' }}

  manifest:
    name: 📦 Publish multi-arch manifest
    needs: [version, init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: 📦 Publish multi-arch manifest
        if: ${{ needs.version.outputs.should_publish == 'true' }}
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.BUILD_IMAGE_NAME }}
          registry-prefix: ${{ needs.init.outputs.registry-prefix }}
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest

      - name: 🏷️ Promote multi-arch manifest
        if: ${{ needs.version.outputs.should_publish == 'true' }}
        run: |
          # GHCR namespaces must be lowercase; github.repository_owner may not be.
          REGISTRY_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tags=("${{ needs.version.outputs.version }}" "latest")

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("--tag" "${REGISTRY_PREFIX}/${IMAGE_NAME}:${tag}")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${REGISTRY_PREFIX}/${BUILD_IMAGE_NAME}:${tags[0]}"

          cosign sign --yes "${REGISTRY_PREFIX}/${IMAGE_NAME}:${tags[0]}"

      - name: 🧹 Delete intermediate -build packages
        # The per-arch and combined -build images only exist so imagetools can
        # stitch the multi-arch manifest; once promoted they're dead weight and
        # should never be visible to users. Cleanup failure must not fail the
        # release. Package deletion is not supported by GITHUB_TOKEN, so this
        # needs a classic PAT with read:packages + delete:packages scopes.
        if: ${{ needs.version.outputs.should_publish == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DELETE_INTERMEDIATE_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          pkgs=$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages?package_type=container" \
            --paginate --jq '.[].name' | grep -F "${BUILD_IMAGE_NAME}" || true)
          [ -z "$pkgs" ] && { echo "No -build packages found"; exit 0; }
          while IFS= read -r pkg; do
            enc=$(jq -rn --arg p "$pkg" '$p|@uri')
            echo "Deleting intermediate package ${pkg}"
            gh api -X DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${enc}"
          done <<< "$pkgs"

  standalone:
    name: 🐳 Build & Publish standalone image
    needs:
      - version
      - prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 🧶 Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: yarn

      - name: ⏬ Install dependencies
        run: yarn install --immutable

      - name: ⏬ Download packaged app
        uses: actions/download-artifact@v8
        with:
          name: packaged-app
          path: ps5-mqtt/server/.packaged

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build & publish standalone image
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ github.repository_owner }}
          IMAGE: ps5-mqtt
          TAGS: "${{ needs.version.outputs.version }} latest"
          PLATFORMS: linux/amd64,linux/arm64
          SKIP_PACKAGE: "1"
          DRY_RUN: ${{ needs.version.outputs.should_publish == 'true' && '0' || '1' }}
        run: yarn workspace @ps5-mqtt/server publish

  release:
    name: 🚀 Finalize release
    needs:
      - version
      - build
      - manifest
      - standalone
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Deliberately not pinned to github.sha: the version-bump commit must
      # apply on top of whatever main is when we get here.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: 🧶 Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: yarn

      - name: ⏬ Install dependencies
        run: yarn install --immutable

      - name: 🔖 Apply release version
        run: yarn bump-version ${{ needs.version.outputs.version }}

      - name: ⏭ Sync add-on docs
        run: |
          cp README.md add-ons/ps5-mqtt/README.md
          cp docs/DOCS.md add-ons/ps5-mqtt/DOCS.md

      # Only needed to exercise changelog generation on a workflow_dispatch
      # dry run; a real run already has notes from the published release.
      - name: 📝 Draft release notes
        id: notes
        if: ${{ github.event_name != 'release' }}
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✍ Update changelog
        env:
          RELEASE_NOTES: ${{ github.event_name == 'release' && github.event.release.body || steps.notes.outputs.body }}
        run: yarn update-changelog ${{ needs.version.outputs.version }}

      - name: 🛡 Ensure main hasn't moved since this release was published
        if: ${{ needs.version.outputs.should_publish == 'true' }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          current=$(git rev-parse origin/main)
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "::error::main has advanced from ${{ github.sha }} to $current since this release" \
              "was published. The published images were built from the older commit, so moving the" \
              "release tag now would point it at a tree that doesn't match the shipped images." \
              "Publish a new release instead."
            exit 1
          fi

      - name: 🙌 Commit release version bump
        id: commit
        if: ${{ needs.version.outputs.should_publish == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: >-
            🔖 Release ${{ needs.version.outputs.tag }} [skip ci]
          file_pattern: >-
            package.json
            add-ons/ps5-mqtt/config.yaml
            add-ons/ps5-mqtt/CHANGELOG.md
            add-ons/ps5-mqtt/README.md
            add-ons/ps5-mqtt/DOCS.md

      # Publishing the release already created the tag, pointed at whatever
      # main was at publish time — before this run built anything. Move it
      # onto the version-bump commit so the tag (and the release's "Source
      # code" download) matches the tree the published images were built
      # from.
      - name: 🏷 Move release tag onto the version-bump commit
        if: ${{ needs.version.outputs.should_publish == 'true' }}
        run: |
          set -euo pipefail
          git tag -f ${{ needs.version.outputs.tag }} ${{ steps.commit.outputs.commit_hash }}
          git push --force origin ${{ needs.version.outputs.tag }}
